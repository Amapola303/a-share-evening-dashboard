name: Refresh A-share evening dashboard data

on:
  schedule:
    # GitHub cron uses UTC. These are Beijing 11:45 / 17:30 / 19:00.
    - cron: "45 3 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      review_date:
        description: "Optional review date (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: a-share-evening-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use stable Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect same-day market data
        env:
          REVIEW_DATE: ${{ inputs.review_date }}
        run: node scripts/fetch-dashboard-data.mjs
      - name: Commit the verified snapshot
        run: |
          if git diff --quiet -- docs/data; then
            echo "No same-day snapshot change (possibly a non-trading day)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "Update evening dashboard data"
          git pull --rebase origin main
          git push origin HEAD:main
