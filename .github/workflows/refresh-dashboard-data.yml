name: Refresh A-share evening dashboard data

on:
  schedule:
    # GitHub cron uses UTC: 11:05/11:35 = Beijing 19:05/19:35.
    - cron: "5 11 * * 1-5"
    - cron: "35 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a-share-evening-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Collect same-day market data
        run: node scripts/fetch-dashboard-data.mjs
      - name: Commit the verified snapshot
        run: |
          if git diff --quiet -- docs/data; then
            echo "No same-day snapshot change (possibly a non-trading day)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "Update evening dashboard data"
          git pull --rebase origin main
          git push origin HEAD:main
